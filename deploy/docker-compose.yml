# ============================================
# GrowMate EDU:OS - Docker Compose 部署配置
# 用法: docker compose -f deploy/docker-compose.yml up -d
# ============================================

services:
  growmate-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: growmate-edu-os
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
