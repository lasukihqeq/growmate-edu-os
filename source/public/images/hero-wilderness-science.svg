<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4FC"/>
      <stop offset="50%" style="stop-color:#F5F9FC"/>
      <stop offset="100%" style="stop-color:#FEFEF8"/>
    </linearGradient>
    
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6FE3"/>
      <stop offset="100%" style="stop-color:#3B5FD9"/>
    </linearGradient>
    
    <linearGradient id="warmYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342"/>
      <stop offset="100%" style="stop-color:#558B2F"/>
    </linearGradient>
    
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B8E23"/>
      <stop offset="100%" style="stop-color:#4A7023"/>
    </linearGradient>
    
    <!-- 纹理滤镜 -->
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
    </filter>
    
    <!-- 手绘风格滤镜 -->
    <filter id="handDrawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- 远山背景 -->
  <path d="M0 600 Q200 450 400 520 Q600 480 800 450 Q1000 400 1200 480 Q1400 420 1600 500 Q1800 460 1920 520 L1920 1080 L0 1080 Z" 
        fill="#C5E1A5" opacity="0.4"/>
  <path d="M0 700 Q300 550 600 620 Q900 580 1200 650 Q1500 600 1920 680 L1920 1080 L0 1080 Z" 
        fill="#8BC34A" opacity="0.3"/>
  
  <!-- 草地 -->
  <ellipse cx="960" cy="950" rx="1100" ry="200" fill="#8BC34A" opacity="0.6"/>
  <ellipse cx="960" cy="980" rx="1050" ry="150" fill="#7CB342" opacity="0.7"/>
  
  <!-- 大树 - 左侧 -->
  <g transform="translate(200, 300)">
    <!-- 树干 -->
    <path d="M80 400 Q70 300 90 200 Q95 150 80 100 L120 100 Q105 150 110 200 Q130 300 120 400 Z" 
          fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
    <!-- 树根 -->
    <path d="M60 400 Q40 420 30 450 Q25 470 35 480" stroke="#8D6E63" stroke-width="8" fill="none"/>
    <path d="M140 400 Q160 420 170 450 Q175 470 165 480" stroke="#8D6E63" stroke-width="8" fill="none"/>
    <!-- 树冠 -->
    <ellipse cx="100" cy="80" rx="120" ry="100" fill="url(#treeGradient)"/>
    <ellipse cx="60" cy="100" rx="60" ry="50" fill="#7CB342"/>
    <ellipse cx="140" cy="90" rx="70" ry="60" fill="#8BC34A"/>
    <ellipse cx="100" cy="40" rx="50" ry="40" fill="#9CCC65"/>
  </g>
  
  <!-- 大树 - 右侧 -->
  <g transform="translate(1600, 350)">
    <path d="M80 350 Q70 250 90 150 L120 150 Q100 250 120 350 Z" 
          fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
    <ellipse cx="100" cy="80" rx="100" ry="90" fill="url(#treeGradient)"/>
    <ellipse cx="60" cy="90" rx="50" ry="45" fill="#7CB342"/>
    <ellipse cx="140" cy="85" rx="55" ry="50" fill="#8BC34A"/>
  </g>
  
  <!-- 中景灌木 -->
  <g fill="#7CB342">
    <ellipse cx="400" cy="850" rx="80" ry="40"/>
    <ellipse cx="350" cy="840" rx="50" ry="30"/>
    <ellipse cx="450" cy="845" rx="60" ry="35"/>
    
    <ellipse cx="1500" cy="860" rx="70" ry="35"/>
    <ellipse cx="1450" cy="850" rx="45" ry="28"/>
    <ellipse cx="1550" cy="855" rx="50" ry="30"/>
  </g>
  
  <!-- 花朵装饰 -->
  <g fill="#FFB800">
    <circle cx="500" cy="880" r="8"/>
    <circle cx="520" cy="870" r="6"/>
    <circle cx="480" cy="875" r="5"/>
    
    <circle cx="1400" cy="885" r="7"/>
    <circle cx="1420" cy="878" r="5"/>
  </g>
  
  <!-- 蝴蝶 - 主角上方 -->
  <g transform="translate(950, 280)">
    <!-- 左翅 -->
    <path d="M0 0 Q-40 -30 -50 10 Q-40 40 0 20 Q-10 10 0 0" 
          fill="url(#brandBlue)" stroke="#3B5FD9" stroke-width="1.5" opacity="0.9"/>
    <path d="M0 20 Q-30 30 -25 50 Q-10 45 0 30" 
          fill="#4A6FE3" stroke="#3B5FD9" stroke-width="1"/>
    <!-- 右翅 -->
    <path d="M0 0 Q40 -30 50 10 Q40 40 0 20 Q10 10 0 0" 
          fill="url(#brandBlue)" stroke="#3B5FD9" stroke-width="1.5" opacity="0.9"/>
    <path d="M0 20 Q30 30 25 50 Q10 45 0 30" 
          fill="#4A6FE3" stroke="#3B5FD9" stroke-width="1"/>
    <!-- 翅膀纹理 -->
    <circle cx="-25" cy="5" r="8" fill="#FFB800" opacity="0.7"/>
    <circle cx="25" cy="5" r="8" fill="#FFB800" opacity="0.7"/>
    <circle cx="-15" cy="35" r="4" fill="#FFF" opacity="0.5"/>
    <circle cx="15" cy="35" r="4" fill="#FFF" opacity="0.5"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="15" rx="4" ry="20" fill="#2D3A4A"/>
    <!-- 触角 -->
    <path d="M-2 -5 Q-10 -20 -8 -25" stroke="#2D3A4A" stroke-width="1.5" fill="none"/>
    <path d="M2 -5 Q10 -20 8 -25" stroke="#2D3A4A" stroke-width="1.5" fill="none"/>
    <circle cx="-8" cy="-25" r="2" fill="#2D3A4A"/>
    <circle cx="8" cy="-25" r="2" fill="#2D3A4A"/>
  </g>
  
  <!-- 小蝴蝶 - 装饰 -->
  <g transform="translate(300, 400)" opacity="0.7">
    <path d="M0 0 Q-20 -15 -25 5 Q-20 20 0 10" fill="#FFB800"/>
    <path d="M0 0 Q20 -15 25 5 Q20 20 0 10" fill="#FFB800"/>
    <ellipse cx="0" cy="5" rx="2" ry="10" fill="#5D4037"/>
  </g>
  
  <g transform="translate(1650, 500)" opacity="0.6">
    <path d="M0 0 Q-15 -12 -18 4 Q-15 15 0 8" fill="#3B5FD9"/>
    <path d="M0 0 Q15 -12 18 4 Q15 15 0 8" fill="#3B5FD9"/>
    <ellipse cx="0" cy="4" rx="1.5" ry="8" fill="#2D3A4A"/>
  </g>
  
  <!-- 孩子 - 主角 -->
  <g transform="translate(850, 550)">
    <!-- 身体 -->
    <ellipse cx="0" cy="200" rx="45" ry="60" fill="#3B5FD9"/>
    <!-- 腿 -->
    <path d="M-20 250 Q-30 300 -25 350 L-5 350 L0 280" fill="#4A6FE3"/>
    <path d="M20 250 Q30 300 25 350 L5 350 L0 280" fill="#4A6FE3"/>
    <!-- 鞋子 -->
    <ellipse cx="-15" cy="355" rx="18" ry="10" fill="#5D4037"/>
    <ellipse cx="15" cy="355" rx="18" ry="10" fill="#5D4037"/>
    <!-- 手臂 -->
    <path d="M-45 180 Q-80 160 -100 140" stroke="#FFCCBC" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M45 180 Q60 150 80 130" stroke="#FFCCBC" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- 头部 -->
    <circle cx="0" cy="120" r="55" fill="#FFCCBC"/>
    <!-- 头发 -->
    <path d="M-45 100 Q-50 70 -30 60 Q0 50 30 60 Q50 70 45 100 Q30 85 0 90 Q-30 85 -45 100" 
          fill="#5D4037"/>
    <!-- 刘海 -->
    <path d="M-35 85 Q-20 70 0 75 Q20 70 35 85" fill="#5D4037"/>
    <!-- 眼睛 -->
    <ellipse cx="-18" cy="115" rx="8" ry="10" fill="#FFF"/>
    <ellipse cx="18" cy="115" rx="8" ry="10" fill="#FFF"/>
    <circle cx="-18" cy="117" r="5" fill="#3B5FD9"/>
    <circle cx="18" cy="117" r="5" fill="#3B5FD9"/>
    <circle cx="-16" cy="115" r="2" fill="#FFF"/>
    <circle cx="20" cy="115" r="2" fill="#FFF"/>
    <!-- 微笑 -->
    <path d="M-12 140 Q0 155 12 140" stroke="#8D6E63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="-35" cy="130" rx="10" ry="6" fill="#FFAB91" opacity="0.5"/>
    <ellipse cx="35" cy="130" rx="10" ry="6" fill="#FFAB91" opacity="0.5"/>
  </g>
  
  <!-- 放大镜 - 孩子手中 -->
  <g transform="translate(720, 680)">
    <!-- 手柄 -->
    <rect x="60" y="60" width="50" height="14" rx="7" fill="#8D6E63" transform="rotate(45, 60, 67)"/>
    <!-- 镜框 -->
    <circle cx="35" cy="35" r="50" fill="none" stroke="#5D4037" stroke-width="10"/>
    <!-- 镜片 -->
    <circle cx="35" cy="35" r="42" fill="#E3F2FD" opacity="0.6"/>
    <circle cx="35" cy="35" r="42" fill="none" stroke="#3B5FD9" stroke-width="2" opacity="0.5"/>
    <!-- 高光 -->
    <ellipse cx="20" cy="25" rx="15" ry="8" fill="#FFF" opacity="0.7"/>
  </g>
  
  <!-- 放大镜中的细节 - 叶脉 -->
  <g transform="translate(700, 720)" clip-path="url(#magnifierClip)">
    <path d="M0 0 Q20 30 10 60 Q5 45 -5 60 Q-15 30 0 0" fill="#7CB342" stroke="#558B2F" stroke-width="1"/>
    <path d="M0 10 L5 40 M0 20 L-3 35 M0 30 L3 50" stroke="#558B2F" stroke-width="0.5"/>
  </g>
  
  <!-- 前景植物 -->
  <!-- 左下角植物 -->
  <g transform="translate(100, 800)">
    <path d="M0 200 Q10 150 5 100 Q0 50 10 0" stroke="#558B2F" stroke-width="4" fill="none"/>
    <path d="M0 200 Q-30 180 -40 140" stroke="#558B2F" stroke-width="3" fill="none"/>
    <ellipse cx="10" cy="20" rx="25" ry="40" fill="#8BC34A" transform="rotate(-10, 10, 20)"/>
    <ellipse cx="-20" cy="60" rx="20" ry="35" fill="#7CB342" transform="rotate(15, -20, 60)"/>
    <ellipse cx="30" cy="80" rx="18" ry="30" fill="#9CCC65" transform="rotate(-5, 30, 80)"/>
  </g>
  
  <!-- 右下角植物 -->
  <g transform="translate(1750, 850)">
    <path d="M0 150 Q-10 100 0 50" stroke="#558B2F" stroke-width="3" fill="none"/>
    <ellipse cx="0" cy="30" rx="30" ry="45" fill="#7CB342"/>
    <ellipse cx="-25" cy="60" rx="20" ry="30" fill="#8BC34A"/>
    <ellipse cx="25" cy="50" rx="22" ry="35" fill="#9CCC65"/>
  </g>
  
  <!-- 飘落的树叶 -->
  <g fill="#8BC34A" opacity="0.8">
    <ellipse cx="300" cy="500" rx="12" ry="6" transform="rotate(30, 300, 500)"/>
    <ellipse cx="1500" cy="400" rx="10" ry="5" transform="rotate(-20, 1500, 400)"/>
    <ellipse cx="1200" cy="600" rx="8" ry="4" transform="rotate(45, 1200, 600)"/>
    <ellipse cx="600" cy="350" rx="11" ry="5" transform="rotate(-35, 600, 350)"/>
  </g>
  
  <!-- 小鸟 -->
  <g transform="translate(1300, 200)">
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="#FFB800"/>
    <circle cx="20" cy="-5" r="12" fill="#FFD54F"/>
    <polygon points="32,-5 42,-3 32,0" fill="#FF8F00"/>
    <circle cx="25" cy="-7" r="3" fill="#2D3A4A"/>
    <path d="M-15 5 Q-30 15 -40 5 Q-30 10 -15 5" fill="#8D6E63"/>
    <path d="M-10 10 Q-15 20 -20 15" stroke="#FFB800" stroke-width="3" fill="none"/>
  </g>
  
  <!-- 另一只小鸟 -->
  <g transform="translate(400, 300)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#3B5FD9"/>
    <circle cx="15" cy="-3" r="10" fill="#4A6FE3"/>
    <polygon points="25,-3 33,-1 25,1" fill="#FFB800"/>
    <circle cx="19" cy="-5" r="2.5" fill="#2D3A4A"/>
    <path d="M-12 4 Q-22 12 -30 4 Q-22 8 -12 4" fill="#2D3A4A"/>
  </g>
  
  <!-- 昆虫装饰 -->
  <!-- 瓢虫 -->
  <g transform="translate(550, 900)">
    <ellipse cx="0" cy="0" rx="15" ry="12" fill="#E53935"/>
    <circle cx="0" cy="-8" r="8" fill="#2D3A4A"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#2D3A4A" stroke-width="1"/>
    <circle cx="-7" cy="-3" r="3" fill="#2D3A4A"/>
    <circle cx="7" cy="-3" r="3" fill="#2D3A4A"/>
    <circle cx="-5" cy="5" r="2" fill="#2D3A4A"/>
    <circle cx="5" cy="5" r="2" fill="#2D3A4A"/>
  </g>
  
  <!-- 蜜蜂 -->
  <g transform="translate(1100, 450)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#FFB800"/>
    <rect x="-12" y="-8" width="6" height="16" fill="#2D3A4A"/>
    <rect x="2" y="-8" width="6" height="16" fill="#2D3A4A"/>
    <circle cx="20" cy="-2" r="6" fill="#FFB800"/>
    <circle cx="24" cy="-4" r="2" fill="#2D3A4A"/>
    <!-- 翅膀 -->
    <ellipse cx="-5" cy="-15" rx="12" ry="8" fill="#E3F2FD" opacity="0.7"/>
    <ellipse cx="5" cy="-15" rx="12" ry="8" fill="#E3F2FD" opacity="0.7"/>
    <!-- 触角 -->
    <path d="M22 -8 Q26 -14 24 -18" stroke="#2D3A4A" stroke-width="1.5" fill="none"/>
    <path d="M26 -8 Q30 -14 28 -18" stroke="#2D3A4A" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- 品牌装饰元素 - 探索标记 -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="30" fill="url(#brandBlue)" opacity="0.15"/>
    <path d="M-8 -5 L8 -5 L8 10 L0 5 L-8 10 Z" fill="#3B5FD9" opacity="0.6"/>
  </g>
  
  <g transform="translate(1820, 900)">
    <circle cx="0" cy="0" r="25" fill="url(#warmYellow)" opacity="0.2"/>
    <path d="M-6 -4 L6 -4 L6 8 L0 4 L-6 8 Z" fill="#FFB800" opacity="0.5"/>
  </g>
  
  <!-- 光斑效果 -->
  <circle cx="200" cy="200" r="80" fill="#FFB800" opacity="0.08"/>
  <circle cx="1700" cy="150" r="60" fill="#FFB800" opacity="0.06"/>
  <circle cx="1000" cy="100" r="100" fill="#FFF" opacity="0.1"/>
  
  <!-- 底部品牌色装饰带 -->
  <rect x="0" y="1020" width="1920" height="60" fill="url(#brandBlue)" opacity="0.1"/>
  <rect x="0" y="1040" width="1920" height="40" fill="url(#brandBlue)" opacity="0.05"/>
  
  <!-- 手绘风格边框 -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#3B5FD9" stroke-width="2" opacity="0.2" rx="10"/>
</svg>