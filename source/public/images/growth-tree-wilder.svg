<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F9FC"/>
      <stop offset="100%" style="stop-color:#E8F4FC"/>
    </linearGradient>
    
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6FE3"/>
      <stop offset="100%" style="stop-color:#3B5FD9"/>
    </linearGradient>
    
    <linearGradient id="warmYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5D4037"/>
      <stop offset="30%" style="stop-color:#8D6E63"/>
      <stop offset="70%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#5D4037"/>
    </linearGradient>
    
    <linearGradient id="rootGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6D4C41"/>
      <stop offset="100%" style="stop-color:#4E342E"/>
    </linearGradient>
    
    <!-- 六维颜色 -->
    <linearGradient id="wonderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    
    <linearGradient id="inquiryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B5FD9"/>
      <stop offset="100%" style="stop-color:#1A237E"/>
    </linearGradient>
    
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A"/>
      <stop offset="100%" style="stop-color:#558B2F"/>
    </linearGradient>
    
    <linearGradient id="designGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63"/>
      <stop offset="100%" style="stop-color:#AD1457"/>
    </linearGradient>
    
    <linearGradient id="expressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0"/>
      <stop offset="100%" style="stop-color:#6A1B9A"/>
    </linearGradient>
    
    <linearGradient id="reflectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4"/>
      <stop offset="100%" style="stop-color:#00838F"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="900" fill="url(#bgGradient)"/>
  
  <!-- 装饰圆圈背景 -->
  <circle cx="600" cy="400" r="350" fill="none" stroke="#3B5FD9" stroke-width="1" opacity="0.08"/>
  <circle cx="600" cy="400" r="300" fill="none" stroke="#3B5FD9" stroke-width="1" opacity="0.06"/>
  <circle cx="600" cy="400" r="250" fill="none" stroke="#FFB800" stroke-width="1" opacity="0.05"/>
  
  <!-- 树根部分 - 科学评估基础 -->
  <g transform="translate(600, 750)">
    <!-- 主根 -->
    <path d="M-30 -30 Q-80 30 -120 80" stroke="url(#rootGradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
    <path d="M30 -30 Q80 30 120 80" stroke="url(#rootGradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
    <path d="M-10 -25 Q-30 40 -50 90" stroke="url(#rootGradient)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M10 -25 Q30 40 50 90" stroke="url(#rootGradient)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M0 -20 Q0 50 0 100" stroke="url(#rootGradient)" stroke-width="15" fill="none" stroke-linecap="round"/>
    
    <!-- 细根 -->
    <path d="M-80 50 Q-100 70 -110 90" stroke="#8D6E63" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M80 50 Q100 70 110 90" stroke="#8D6E63" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- 根部标签 -->
    <rect x="-80" y="95" width="160" height="35" rx="8" fill="url(#brandBlue)" opacity="0.9"/>
    <text x="0" y="118" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">科学评估基础</text>
  </g>
  
  <!-- 树干 -->
  <g transform="translate(600, 600)">
    <path d="M-35 -200 Q-45 -100 -30 100 Q-20 150 0 180 Q20 150 30 100 Q45 -100 35 -200 Z" 
          fill="url(#trunkGradient)"/>
    <!-- 树干纹理 -->
    <path d="M-20 -150 Q-15 -50 -25 50" stroke="#5D4037" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M10 -120 Q15 -20 5 80" stroke="#5D4037" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M25 -80 Q20 0 30 60" stroke="#5D4037" stroke-width="1.5" fill="none" opacity="0.2"/>
  </g>
  
  <!-- 主树冠 - 中心 -->
  <g transform="translate(600, 350)">
    <ellipse cx="0" cy="0" rx="180" ry="150" fill="#7CB342"/>
    <ellipse cx="-60" cy="30" rx="80" ry="70" fill="#8BC34A"/>
    <ellipse cx="60" cy="20" rx="90" ry="75" fill="#9CCC65"/>
    <ellipse cx="0" cy="-40" rx="100" ry="80" fill="#AED581"/>
  </g>
  
  <!-- W - Wonder 好奇心 - 树冠顶部 -->
  <g transform="translate(600, 140)">
    <!-- 分支 -->
    <path d="M0 100 Q-20 60 -10 20" stroke="#6B8E23" stroke-width="12" fill="none"/>
    <path d="M0 100 Q20 60 10 20" stroke="#6B8E23" stroke-width="12" fill="none"/>
    <!-- 叶簇 -->
    <ellipse cx="0" cy="0" rx="70" ry="55" fill="#C5E1A5"/>
    <ellipse cx="-30" cy="20" rx="40" ry="35" fill="#AED581"/>
    <ellipse cx="30" cy="15" rx="45" ry="38" fill="#9CCC65"/>
    
    <!-- 望远镜图标 -->
    <g transform="translate(-35, -20)">
      <rect x="0" y="0" width="30" height="18" rx="4" fill="url(#wonderGrad)"/>
      <circle cx="8" cy="9" r="6" fill="#FFF" opacity="0.7"/>
      <circle cx="22" cy="9" r="6" fill="#FFF" opacity="0.7"/>
      <circle cx="8" cy="9" r="4" fill="#FF8F00" opacity="0.5"/>
      <circle cx="22" cy="9" r="4" fill="#FF8F00" opacity="0.5"/>
    </g>
    <!-- 放大镜图标 -->
    <g transform="translate(20, -10)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="url(#wonderGrad)" stroke-width="4"/>
      <line x1="10" y1="10" x2="22" y2="22" stroke="url(#wonderGrad)" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- 标签 -->
    <rect x="-50" y="50" width="100" height="40" rx="10" fill="url(#wonderGrad)"/>
    <text x="0" y="68" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">W 好奇心</text>
    <text x="0" y="82" font-size="10" fill="#FFF" text-anchor="middle" opacity="0.8">Wonder</text>
  </g>
  
  <!-- I - Inquiry 探究力 - 右上 -->
  <g transform="translate(820, 220)">
    <!-- 分支 -->
    <path d="M-80 80 Q-50 40 -20 10" stroke="#6B8E23" stroke-width="10" fill="none"/>
    <!-- 叶簇 -->
    <ellipse cx="0" cy="0" rx="65" ry="55" fill="#8BC34A"/>
    <ellipse cx="-25" cy="15" rx="40" ry="35" fill="#9CCC65"/>
    <ellipse cx="25" cy="10" rx="38" ry="32" fill="#AED581"/>
    
    <!-- 试管图标 -->
    <g transform="translate(-25, -25)">
      <rect x="0" y="0" width="16" height="35" rx="8" fill="none" stroke="url(#inquiryGrad)" stroke-width="3"/>
      <rect x="3" y="15" width="10" height="17" rx="5" fill="url(#inquiryGrad)" opacity="0.6"/>
    </g>
    <!-- 烧杯图标 -->
    <g transform="translate(10, -20)">
      <path d="M5 0 L5 25 Q5 35 15 35 Q25 35 25 25 L25 0 Z" fill="none" stroke="url(#inquiryGrad)" stroke-width="3"/>
      <ellipse cx="15" cy="28" rx="8" ry="5" fill="url(#inquiryGrad)" opacity="0.5"/>
    </g>
    
    <!-- 标签 -->
    <rect x="-50" y="50" width="100" height="40" rx="10" fill="url(#inquiryGrad)"/>
    <text x="0" y="68" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">I 探究力</text>
    <text x="0" y="82" font-size="10" fill="#FFF" text-anchor="middle" opacity="0.8">Inquiry</text>
  </g>
  
  <!-- L - Link 连接力 - 右侧 -->
  <g transform="translate(900, 380)">
    <!-- 分支 -->
    <path d="M-90 0 Q-50 0 -20 0" stroke="#6B8E23" stroke-width="10" fill="none"/>
    <!-- 叶簇 -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="#9CCC65"/>
    <ellipse cx="-20" cy="10" rx="35" ry="30" fill="#AED581"/>
    <ellipse cx="20" cy="5" rx="32" ry="28" fill="#C5E1A5"/>
    
    <!-- 连接线网络图标 -->
    <g transform="translate(-20, -20)">
      <circle cx="0" cy="0" r="8" fill="url(#linkGrad)"/>
      <circle cx="35" cy="-5" r="6" fill="url(#linkGrad)"/>
      <circle cx="25" cy="25" r="6" fill="url(#linkGrad)"/>
      <circle cx="-5" cy="30" r="5" fill="url(#linkGrad)"/>
      <line x1="8" y1="0" x2="29" y2="-5" stroke="url(#linkGrad)" stroke-width="2"/>
      <line x1="5" y1="6" x2="20" y2="20" stroke="url(#linkGrad)" stroke-width="2"/>
      <line x1="0" y1="8" x2="-3" y2="25" stroke="url(#linkGrad)" stroke-width="2"/>
    </g>
    
    <!-- 标签 -->
    <rect x="-50" y="45" width="100" height="40" rx="10" fill="url(#linkGrad)"/>
    <text x="0" y="63" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">L 连接力</text>
    <text x="0" y="77" font-size="10" fill="#FFF" text-anchor="middle" opacity="0.8">Link</text>
  </g>
  
  <!-- D - Design 设计力 - 右下 -->
  <g transform="translate(780, 520)">
    <!-- 分支 -->
    <path d="M-60 60 Q-30 30 0 0" stroke="#6B8E23" stroke-width="10" fill="none"/>
    <!-- 叶簇 -->
    <ellipse cx="0" cy="0" rx="55" ry="48" fill="#AED581"/>
    <ellipse cx="-15" cy="10" rx="32" ry="28" fill="#C5E1A5"/>
    
    <!-- 画笔图标 -->
    <g transform="translate(-15, -20)">
      <path d="M0 35 L0 10 Q0 0 10 0 Q20 0 20 10 L20 35 Z" fill="url(#designGrad)" opacity="0.8"/>
      <rect x="2" y="30" width="16" height="10" fill="#8D6E63"/>
      <path d="M8 40 L10 50 L12 40" fill="#5D4037"/>
    </g>
    <!-- 积木图标 -->
    <g transform="translate(15, -15)">
      <rect x="0" y="10" width="18" height="18" fill="url(#designGrad)" opacity="0.7"/>
      <rect x="10" y="0" width="18" height="18" fill="url(#designGrad)" opacity="0.9"/>
    </g>
    
    <!-- 标签 -->
    <rect x="-50" y="45" width="100" height="40" rx="10" fill="url(#designGrad)"/>
    <text x="0" y="63" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">D 设计力</text>
    <text x="0" y="77" font-size="10" fill="#FFF" text-anchor="middle" opacity="0.8">Design</text>
  </g>
  
  <!-- E - Expression 表达力 - 左下 -->
  <g transform="translate(420, 520)">
    <!-- 分支 -->
    <path d="M60 60 Q30 30 0 0" stroke="#6B8E23" stroke-width="10" fill="none"/>
    <!-- 叶簇 -->
    <ellipse cx="0" cy="0" rx="55" ry="48" fill="#AED581"/>
    <ellipse cx="15" cy="10" rx="32" ry="28" fill="#C5E1A5"/>
    
    <!-- 音符图标 -->
    <g transform="translate(-20, -15)">
      <circle cx="0" cy="25" r="8" fill="url(#expressGrad)"/>
      <rect x="6" y="-5" width="4" height="32" fill="url(#expressGrad)"/>
      <path d="M10 -5 Q25 -10 25 5 Q25 10 10 5" fill="url(#expressGrad)"/>
    </g>
    <!-- 书本/话筒图标 -->
    <g transform="translate(10, -15)">
      <ellipse cx="5" cy="0" rx="12" ry="18" fill="url(#expressGrad)" opacity="0.8"/>
      <ellipse cx="5" cy="0" rx="8" ry="12" fill="#FFF" opacity="0.3"/>
      <rect x="2" y="18" width="6" height="15" fill="url(#expressGrad)"/>
    </g>
    
    <!-- 标签 -->
    <rect x="-50" y="45" width="100" height="40" rx="10" fill="url(#expressGrad)"/>
    <text x="0" y="63" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">E 表达力</text>
    <text x="0" y="77" font-size="10" fill="#FFF" text-anchor="middle" opacity="0.8">Expression</text>
  </g>
  
  <!-- R - Reflection 反思力 - 左侧 -->
  <g transform="translate(300, 380)">
    <!-- 分支 -->
    <path d="M90 0 Q50 0 20 0" stroke="#6B8E23" stroke-width="10" fill="none"/>
    <!-- 叶簇 -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="#9CCC65"/>
    <ellipse cx="20" cy="10" rx="35" ry="30" fill="#AED581"/>
    
    <!-- 镜子图标 -->
    <g transform="translate(-20, -15)">
      <ellipse cx="12" cy="12" rx="15" ry="20" fill="none" stroke="url(#reflectGrad)" stroke-width="4"/>
      <ellipse cx="12" cy="12" rx="12" ry="17" fill="#E0F7FA" opacity="0.6"/>
      <rect x="10" y="30" width="4" height="12" fill="url(#reflectGrad)"/>
    </g>
    <!-- 日记本图标 -->
    <g transform="translate(10, -10)">
      <rect x="0" y="0" width="25" height="32" rx="2" fill="url(#reflectGrad)" opacity="0.8"/>
      <line x1="5" y1="8" x2="20" y2="8" stroke="#FFF" stroke-width="1.5" opacity="0.5"/>
      <line x1="5" y1="14" x2="18" y2="14" stroke="#FFF" stroke-width="1.5" opacity="0.5"/>
      <line x1="5" y1="20" x2="15" y2="20" stroke="#FFF" stroke-width="1.5" opacity="0.5"/>
    </g>
    
    <!-- 标签 -->
    <rect x="-50" y="45" width="100" height="40" rx="10" fill="url(#reflectGrad)"/>
    <text x="0" y="63" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">R 反思力</text>
    <text x="0" y="77" font-size="10" fill="#FFF" text-anchor="middle" opacity="0.8">Reflection</text>
  </g>
  
  <!-- 标题 -->
  <g transform="translate(600, 50)">
    <text x="0" y="0" font-size="28" fill="#3B5FD9" text-anchor="middle" font-weight="bold">WILDER 六维成长树</text>
    <text x="0" y="25" font-size="14" fill="#666" text-anchor="middle">WILDER Growth Model</text>
  </g>
  
  <!-- 装饰元素 -->
  <!-- 飘落的叶子 -->
  <g fill="#8BC34A" opacity="0.5">
    <ellipse cx="150" cy="200" rx="10" ry="5" transform="rotate(30, 150, 200)"/>
    <ellipse cx="1050" cy="180" rx="8" ry="4" transform="rotate(-20, 1050, 180)"/>
    <ellipse cx="200" cy="600" rx="9" ry="4.5" transform="rotate(45, 200, 600)"/>
    <ellipse cx="1000" cy="550" rx="7" ry="3.5" transform="rotate(-35, 1000, 550)"/>
  </g>
  
  <!-- 小鸟 -->
  <g transform="translate(180, 150)">
    <path d="M0 0 Q-12 -8 -22 0 Q-12 3 0 0" fill="#5D4037" opacity="0.6"/>
    <path d="M0 0 Q12 -8 22 0 Q12 3 0 0" fill="#5D4037" opacity="0.6"/>
  </g>
  
  <!-- 边框装饰 -->
  <rect x="15" y="15" width="1170" height="870" fill="none" stroke="#3B5FD9" stroke-width="2" opacity="0.1" rx="10"/>
  
  <!-- 角落装饰 -->
  <circle cx="30" cy="30" r="12" fill="url(#brandBlue)" opacity="0.15"/>
  <circle cx="1170" cy="30" r="12" fill="url(#warmYellow)" opacity="0.15"/>
  <circle cx="30" cy="870" r="12" fill="url(#linkGrad)" opacity="0.15"/>
  <circle cx="1170" cy="870" r="12" fill="url(#brandBlue)" opacity="0.15"/>
  
  <!-- 底部说明 -->
  <g transform="translate(600, 880)">
    <text x="0" y="0" font-size="11" fill="#999" text-anchor="middle">WILDER · 荒野科学潜能评估体系</text>
  </g>
</svg>