<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="eveningSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="30%" style="stop-color:#303F9F"/>
      <stop offset="60%" style="stop-color:#5C6BC0"/>
      <stop offset="100%" style="stop-color:#9FA8DA"/>
    </linearGradient>
    
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6FE3"/>
      <stop offset="100%" style="stop-color:#3B5FD9"/>
    </linearGradient>
    
    <linearGradient id="warmYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    
    <linearGradient id="grassNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
    
    <!-- 星星闪烁滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 夜空背景 -->
  <rect width="1200" height="800" fill="url(#eveningSky)"/>
  
  <!-- 星星 -->
  <g fill="#FFF">
    <!-- 大星星 -->
    <circle cx="100" cy="80" r="2" filter="url(#glow)" opacity="0.9"/>
    <circle cx="250" cy="120" r="2.5" filter="url(#glow)" opacity="0.85"/>
    <circle cx="400" cy="60" r="2" filter="url(#glow)" opacity="0.9"/>
    <circle cx="550" cy="150" r="1.8" filter="url(#glow)" opacity="0.8"/>
    <circle cx="700" cy="80" r="2.2" filter="url(#glow)" opacity="0.9"/>
    <circle cx="850" cy="130" r="2" filter="url(#glow)" opacity="0.85"/>
    <circle cx="1000" cy="70" r="2.5" filter="url(#glow)" opacity="0.9"/>
    <circle cx="1100" cy="100" r="1.8" filter="url(#glow)" opacity="0.8"/>
    
    <!-- 小星星 -->
    <circle cx="150" cy="180" r="1" opacity="0.6"/>
    <circle cx="320" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="480" cy="200" r="1" opacity="0.5"/>
    <circle cx="620" cy="50" r="1.2" opacity="0.6"/>
    <circle cx="780" cy="170" r="1" opacity="0.7"/>
    <circle cx="920" cy="45" r="1.2" opacity="0.6"/>
    <circle cx="1050" cy="160" r="1" opacity="0.5"/>
    
    <!-- 更多星星 -->
    <circle cx="50" cy="200" r="0.8" opacity="0.4"/>
    <circle cx="180" cy="250" r="1" opacity="0.5"/>
    <circle cx="350" cy="180" r="0.8" opacity="0.4"/>
    <circle cx="520" cy="90" r="1" opacity="0.5"/>
    <circle cx="680" cy="220" r="0.8" opacity="0.4"/>
    <circle cx="820" cy="60" r="1" opacity="0.5"/>
    <circle cx="950" cy="200" r="0.8" opacity="0.4"/>
    <circle cx="1150" cy="180" r="1" opacity="0.5"/>
  </g>
  
  <!-- 月亮 -->
  <circle cx="1050" cy="120" r="50" fill="#FFF8E1"/>
  <circle cx="1070" cy="110" r="45" fill="url(#eveningSky)"/>
  <!-- 月亮光晕 -->
  <circle cx="1050" cy="120" r="60" fill="none" stroke="#FFF8E1" stroke-width="2" opacity="0.3"/>
  <circle cx="1050" cy="120" r="70" fill="none" stroke="#FFF8E1" stroke-width="1" opacity="0.2"/>
  
  <!-- 流星 -->
  <g opacity="0.7">
    <line x1="200" y1="100" x2="250" y2="130" stroke="url(#warmYellow)" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="100" x2="195" y2="98" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 草地 -->
  <ellipse cx="600" cy="750" rx="800" ry="180" fill="url(#grassNight)"/>
  <ellipse cx="600" cy="780" rx="750" ry="120" fill="#2E7D32" opacity="0.8"/>
  
  <!-- 远处树林剪影 -->
  <g fill="#1B5E20" opacity="0.6">
    <ellipse cx="100" cy="550" rx="80" ry="120"/>
    <ellipse cx="250" cy="580" rx="70" ry="100"/>
    <ellipse cx="1100" cy="560" rx="90" ry="130"/>
    <ellipse cx="950" cy="590" rx="60" ry="90"/>
  </g>
  
  <!-- 萤火虫 -->
  <g fill="#FFB800" filter="url(#glow)">
    <circle cx="300" cy="500" r="3" opacity="0.8"/>
    <circle cx="400" cy="450" r="2.5" opacity="0.7"/>
    <circle cx="800" cy="480" r="3" opacity="0.8"/>
    <circle cx="900" cy="520" r="2.5" opacity="0.7"/>
    <circle cx="500" cy="550" r="2" opacity="0.6"/>
    <circle cx="700" cy="500" r="2" opacity="0.6"/>
    <circle cx="350" cy="600" r="2.5" opacity="0.7"/>
    <circle cx="850" cy="580" r="2" opacity="0.6"/>
  </g>
  
  <!-- 野餐毯 -->
  <g transform="translate(500, 580)">
    <path d="M0 0 L250 0 L280 120 L-30 120 Z" fill="#3B5FD9" opacity="0.8"/>
    <path d="M0 0 L250 0 L280 120 L-30 120 Z" fill="none" stroke="#2D4DB8" stroke-width="2"/>
    <!-- 格子图案 -->
    <line x1="50" y1="0" x2="30" y2="120" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <line x1="100" y1="0" x2="80" y2="120" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <line x1="150" y1="0" x2="130" y2="120" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <line x1="200" y1="0" x2="180" y2="120" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <line x1="-15" y1="30" x2="265" y2="30" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <line x1="-20" y1="60" x2="270" y2="60" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <line x1="-25" y1="90" x2="275" y2="90" stroke="#FFF" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- 望远镜 - 架设在毯子旁 -->
  <g transform="translate(850, 400)">
    <!-- 三脚架 -->
    <line x1="0" y1="50" x2="-40" y2="180" stroke="#5D4037" stroke-width="6"/>
    <line x1="0" y1="50" x2="40" y2="180" stroke="#5D4037" stroke-width="6"/>
    <line x1="0" y1="50" x2="0" y2="190" stroke="#5D4037" stroke-width="6"/>
    <!-- 望远镜主体 -->
    <ellipse cx="0" cy="30" rx="25" ry="50" fill="#37474F"/>
    <ellipse cx="0" cy="-15" rx="20" ry="15" fill="#455A64"/>
    <circle cx="0" cy="-15" r="18" fill="#263238"/>
    <circle cx="0" cy="-15" r="14" fill="#1A237E" opacity="0.5"/>
    <!-- 目镜 -->
    <rect x="5" y="40" width="20" height="30" rx="5" fill="#455A64"/>
  </g>
  
  <!-- 家长 - 坐姿 -->
  <g transform="translate(520, 480)">
    <!-- 身体 -->
    <ellipse cx="0" cy="120" rx="50" ry="65" fill="#5D4037"/>
    <!-- 腿 -->
    <path d="M-30 175 Q-50 200 -60 220 Q-65 235 -50 240" stroke="#4A6FE3" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M30 175 Q50 200 60 220 Q65 235 50 240" stroke="#4A6FE3" stroke-width="28" fill="none" stroke-linecap="round"/>
    <!-- 手臂 - 指向天空 -->
    <path d="M-50 100 Q-70 80 -60 50" stroke="#FFCCBC" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M50 100 Q80 70 100 40" stroke="#FFCCBC" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- 头部 -->
    <circle cx="0" cy="60" r="50" fill="#FFCCBC"/>
    <!-- 头发 -->
    <path d="M-40 40 Q-45 10 -25 0 Q0 -10 25 0 Q45 10 40 40 Q25 30 0 35 Q-25 30 -40 40" fill="#3E2723"/>
    <!-- 眼睛 - 温柔地看向孩子 -->
    <ellipse cx="-15" cy="55" rx="7" ry="9" fill="#FFF"/>
    <ellipse cx="15" cy="55" rx="7" ry="9" fill="#FFF"/>
    <circle cx="-15" cy="57" r="5" fill="#3B5FD9"/>
    <circle cx="15" cy="57" r="5" fill="#3B5FD9"/>
    <circle cx="-13" cy="55" r="2" fill="#FFF"/>
    <circle cx="17" cy="55" r="2" fill="#FFF"/>
    <!-- 微笑 -->
    <path d="M-12 80 Q0 92 12 80" stroke="#8D6E63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="-30" cy="72" rx="10" ry="6" fill="#FFAB91" opacity="0.3"/>
    <ellipse cx="30" cy="72" rx="10" ry="6" fill="#FFAB91" opacity="0.3"/>
  </g>
  
  <!-- 孩子 - 依靠在家长身边 -->
  <g transform="translate(680, 520)">
    <!-- 身体 -->
    <ellipse cx="0" cy="100" rx="35" ry="50" fill="#FFB800"/>
    <!-- 腿 -->
    <path d="M-15 145 Q-25 170 -30 190" stroke="#5D4037" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M15 145 Q25 170 35 185" stroke="#5D4037" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- 鞋 -->
    <ellipse cx="-30" cy="195" rx="15" ry="8" fill="#3E2723"/>
    <ellipse cx="40" cy="188" rx="15" ry="8" fill="#3E2723"/>
    <!-- 手臂 - 拿着星图 -->
    <path d="M-35 80 Q-55 70 -60 50" stroke="#FFCCBC" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M35 80 Q50 70 55 90" stroke="#FFCCBC" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- 星图/书本 -->
    <g transform="translate(60, 80)">
      <rect x="-25" y="-30" width="50" height="60" rx="3" fill="#FFF" stroke="#DDD" stroke-width="1"/>
      <!-- 星座图 -->
      <circle cx="0" cy="-10" r="3" fill="#FFB800"/>
      <circle cx="-10" cy="0" r="2.5" fill="#FFB800"/>
      <circle cx="10" cy="5" r="2" fill="#FFB800"/>
      <circle cx="5" cy="-15" r="2" fill="#FFB800"/>
      <circle cx="-8" cy="-18" r="1.5" fill="#FFB800"/>
      <line x1="0" y1="-10" x2="-10" y2="0" stroke="#3B5FD9" stroke-width="1" opacity="0.6"/>
      <line x1="-10" y1="0" x2="10" y2="5" stroke="#3B5FD9" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="-10" x2="5" y2="-15" stroke="#3B5FD9" stroke-width="1" opacity="0.6"/>
      <line x1="5" y1="-15" x2="-8" y2="-18" stroke="#3B5FD9" stroke-width="1" opacity="0.6"/>
    </g>
    <!-- 头部 -->
    <circle cx="0" cy="45" r="40" fill="#FFCCBC"/>
    <!-- 头发 -->
    <path d="M-30 28 Q-35 10 -20 5 Q0 -2 20 5 Q35 10 30 28 Q18 20 0 22 Q-18 20 -30 28" fill="#5D4037"/>
    <!-- 刘海 -->
    <path d="M-22 22 Q0 12 22 22" fill="#5D4037"/>
    <!-- 眼睛 - 仰望星空 -->
    <ellipse cx="-10" cy="42" rx="6" ry="8" fill="#FFF"/>
    <ellipse cx="10" cy="42" rx="6" ry="8" fill="#FFF"/>
    <circle cx="-10" cy="40" r="4" fill="#3B5FD9"/>
    <circle cx="10" cy="40" r="4" fill="#3B5FD9"/>
    <circle cx="-8" cy="38" r="1.5" fill="#FFF"/>
    <circle cx="12" cy="38" r="1.5" fill="#FFF"/>
    <!-- 微笑 - 兴奋 -->
    <path d="M-8 60 Q0 70 8 60" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="-22" cy="52" rx="8" ry="5" fill="#FFAB91" opacity="0.4"/>
    <ellipse cx="22" cy="52" rx="8" ry="5" fill="#FFAB91" opacity="0.4"/>
  </g>
  
  <!-- 指向的星座 - 北斗七星 -->
  <g transform="translate(400, 200)">
    <!-- 星星 -->
    <circle cx="0" cy="0" r="4" fill="#FFF" filter="url(#glow)"/>
    <circle cx="50" cy="20" r="3.5" fill="#FFF" filter="url(#glow)"/>
    <circle cx="100" cy="15" r="4" fill="#FFF" filter="url(#glow)"/>
    <circle cx="150" cy="30" r="3.5" fill="#FFF" filter="url(#glow)"/>
    <circle cx="180" cy="70" r="4" fill="#FFF" filter="url(#glow)"/>
    <circle cx="160" cy="120" r="3.5" fill="#FFF" filter="url(#glow)"/>
    <circle cx="200" cy="150" r="4" fill="#FFF" filter="url(#glow)"/>
    <!-- 连线 -->
    <polyline points="0,0 50,20 100,15 150,30 180,70 160,120 200,150" 
              stroke="#FFB800" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 手指指示线 -->
  <path d="M620 480 Q550 400 480 300 Q460 260 420 230" stroke="#FFF" stroke-width="1.5" fill="none" stroke-dasharray="8,4" opacity="0.4"/>
  
  <!-- 前景草丛 -->
  <g fill="#2E7D32">
    <ellipse cx="100" cy="700" rx="80" ry="40"/>
    <ellipse cx="1100" cy="690" rx="70" ry="35"/>
  </g>
  
  <!-- 花朵 -->
  <g transform="translate(80, 680)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#1B5E20" stroke-width="2"/>
    <circle cx="0" cy="-5" r="8" fill="#FFB800" opacity="0.8"/>
  </g>
  
  <!-- 装饰元素 - 心形 -->
  <g transform="translate(600, 350)" opacity="0.15">
    <path d="M0 10 Q-15 -5 -15 -15 Q-15 -25 0 -20 Q15 -25 15 -15 Q15 -5 0 10" fill="#FFB800"/>
  </g>
  
  <!-- 边框 -->
  <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.15" rx="8"/>
  
  <!-- 角落装饰 -->
  <g transform="translate(25, 25)">
    <circle cx="0" cy="0" r="10" fill="#FFB800" opacity="0.2"/>
    <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3,5 0,2.5 -3,5 -2,1 -5,-1.5 -1.5,-1.5" fill="#FFB800" opacity="0.5" transform="scale(0.8)"/>
  </g>
  
  <g transform="translate(1175, 25)">
    <circle cx="0" cy="0" r="10" fill="#3B5FD9" opacity="0.2"/>
    <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3,5 0,2.5 -3,5 -2,1 -5,-1.5 -1.5,-1.5" fill="#3B5FD9" opacity="0.5" transform="scale(0.8)"/>
  </g>
  
  <!-- 品牌标语区域 -->
  <g transform="translate(60, 750)">
    <text font-size="14" fill="#FFF" opacity="0.5" font-style="italic">陪伴成长 · 共同发现</text>
  </g>
</svg>