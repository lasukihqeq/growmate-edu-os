<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="outdoorSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="60%" style="stop-color:#B0E0E6"/>
      <stop offset="100%" style="stop-color:#E8F5E9"/>
    </linearGradient>
    
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6FE3"/>
      <stop offset="100%" style="stop-color:#3B5FD9"/>
    </linearGradient>
    
    <linearGradient id="warmYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    
    <linearGradient id="grassGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A"/>
      <stop offset="100%" style="stop-color:#689F38"/>
    </linearGradient>
    
    <linearGradient id="hillGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#66BB6A"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="800" fill="url(#outdoorSky)"/>
  
  <!-- 太阳 -->
  <circle cx="1050" cy="100" r="60" fill="#FFB800" opacity="0.8"/>
  <circle cx="1050" cy="100" r="50" fill="#FFD54F"/>
  <!-- 阳光 -->
  <g stroke="#FFB800" stroke-width="3" opacity="0.4">
    <line x1="1050" y1="20" x2="1050" y2="-10"/>
    <line x1="1100" y1="50" x2="1120" y2="30"/>
    <line x1="1130" y1="100" x2="1160" y2="100"/>
    <line x1="1100" y1="150" x2="1120" y2="170"/>
    <line x1="1000" y1="50" x2="980" y2="30"/>
    <line x1="970" y1="100" x2="940" y2="100"/>
    <line x1="1000" y1="150" x2="980" y2="170"/>
  </g>
  
  <!-- 远山 -->
  <path d="M0 450 Q150 350 300 400 Q450 320 600 380 Q750 300 900 360 Q1050 320 1200 400 L1200 800 L0 800 Z" 
        fill="url(#hillGreen)" opacity="0.4"/>
  <path d="M0 550 Q200 450 400 500 Q600 430 800 480 Q1000 440 1200 500 L1200 800 L0 800 Z" 
        fill="#81C784" opacity="0.5"/>
  
  <!-- 树林背景 -->
  <g fill="#4CAF50" opacity="0.6">
    <ellipse cx="100" cy="520" rx="60" ry="100"/>
    <ellipse cx="200" cy="540" rx="50" ry="90"/>
    <ellipse cx="1050" cy="530" rx="70" ry="110"/>
    <ellipse cx="1130" cy="550" rx="55" ry="95"/>
  </g>
  
  <!-- 草地 -->
  <ellipse cx="600" cy="750" rx="800" ry="180" fill="url(#grassGreen)"/>
  <ellipse cx="600" cy="780" rx="750" ry="120" fill="#7CB342"/>
  
  <!-- 小路 -->
  <path d="M600 800 Q580 700 550 620 Q540 580 520 550" stroke="#D7CCC8" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- 孩子们 - 户外探索团队 -->
  <!-- 孩子1 - 观鸟者 -->
  <g transform="translate(200, 480)">
    <!-- 身体 -->
    <ellipse cx="0" cy="150" rx="40" ry="55" fill="url(#brandBlue)"/>
    <!-- 腿 -->
    <path d="M-15 195 Q-20 230 -15 260 L5 260 L0 200" fill="#5D4037"/>
    <path d="M15 195 Q20 230 15 260 L-5 260 L0 200" fill="#5D4037"/>
    <!-- 鞋 -->
    <ellipse cx="-5" cy="265" rx="18" ry="10" fill="#3E2723"/>
    <ellipse cx="5" cy="265" rx="18" ry="10" fill="#3E2723"/>
    <!-- 手臂举望远镜 -->
    <path d="M-40 130 Q-60 100 -50 70" stroke="#FFCCBC" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M40 130 Q60 100 50 70" stroke="#FFCCBC" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- 头部 -->
    <circle cx="0" cy="90" r="45" fill="#FFCCBC"/>
    <!-- 帽子 -->
    <ellipse cx="0" cy="55" rx="55" ry="20" fill="#FFB800"/>
    <ellipse cx="0" cy="45" rx="35" ry="25" fill="#FFB800"/>
    <!-- 头发 -->
    <path d="M-30 70 Q-35 55 -20 50 Q0 45 20 50 Q35 55 30 70" fill="#5D4037"/>
    <!-- 眼睛 -->
    <ellipse cx="-12" cy="85" rx="6" ry="8" fill="#FFF"/>
    <ellipse cx="12" cy="85" rx="6" ry="8" fill="#FFF"/>
    <circle cx="-12" cy="87" r="4" fill="#3B5FD9"/>
    <circle cx="12" cy="87" r="4" fill="#3B5FD9"/>
    <!-- 微笑 -->
    <path d="M-8 105 Q0 115 8 105" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- 双筒望远镜 -->
    <g transform="translate(0, 55)">
      <rect x="-25" y="-20" width="20" height="35" rx="5" fill="#333"/>
      <rect x="5" y="-20" width="20" height="35" rx="5" fill="#333"/>
      <circle cx="-15" cy="-15" r="8" fill="#1A1A1A"/>
      <circle cx="15" cy="-15" r="8" fill="#1A1A1A"/>
      <circle cx="-15" cy="-15" r="6" fill="#3B5FD9" opacity="0.3"/>
      <circle cx="15" cy="-15" r="6" fill="#3B5FD9" opacity="0.3"/>
      <rect x="-5" y="0" width="10" height="8" fill="#444"/>
    </g>
  </g>
  
  <!-- 树上的鸟 - 观察目标 -->
  <g transform="translate(200, 280)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#E53935"/>
    <circle cx="15" cy="-3" r="9" fill="#EF5350"/>
    <polygon points="24,-3 32,0 24,3" fill="#FF8F00"/>
    <circle cx="18" cy="-5" r="2.5" fill="#1A1A1A"/>
    <!-- 翅膀 -->
    <ellipse cx="-8" cy="-5" rx="12" ry="8" fill="#C62828"/>
  </g>
  <!-- 树枝 -->
  <path d="M150 300 Q180 290 250 295" stroke="#8D6E63" stroke-width="6" fill="none"/>
  
  <!-- 孩子2 - 记录者 -->
  <g transform="translate(550, 500)">
    <!-- 蹲姿身体 -->
    <ellipse cx="0" cy="130" rx="45" ry="50" fill="#FFB800"/>
    <!-- 腿 - 蹲姿 -->
    <path d="M-20 160 Q-50 180 -60 200 Q-65 215 -50 220" stroke="#5D4037" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M20 160 Q50 180 60 200 Q65 215 50 220" stroke="#5D4037" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- 手拿笔记本 -->
    <path d="M-45 110 Q-70 120 -75 100" stroke="#FFCCBC" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M45 110 Q60 100 65 85" stroke="#FFCCBC" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- 笔记本 -->
    <g transform="translate(70, 75)">
      <rect x="-30" y="-35" width="60" height="80" rx="3" fill="#FFF" stroke="#DDD" stroke-width="1"/>
      <line x1="-25" y1="-20" x2="25" y2="-20" stroke="#3B5FD9" stroke-width="1" opacity="0.5"/>
      <line x1="-25" y1="-8" x2="20" y2="-8" stroke="#999" stroke-width="1" opacity="0.3"/>
      <line x1="-25" y1="4" x2="22" y2="4" stroke="#999" stroke-width="1" opacity="0.3"/>
      <line x1="-25" y1="16" x2="18" y2="16" stroke="#999" stroke-width="1" opacity="0.3"/>
      <!-- 手绘植物 -->
      <path d="M0 25 Q5 35 0 45 Q-5 35 0 25" fill="#8BC34A"/>
      <circle cx="0" cy="20" r="8" fill="#FFB800" opacity="0.7"/>
    </g>
    <!-- 头部 -->
    <circle cx="0" cy="70" r="42" fill="#FFCCBC"/>
    <!-- 头发 - 女孩发型 -->
    <path d="M-35 55 Q-40 35 -25 25 Q0 15 25 25 Q40 35 35 55 Q20 45 0 50 Q-20 45 -35 55" fill="#5D4037"/>
    <!-- 马尾 -->
    <ellipse cx="38" cy="45" rx="15" ry="25" fill="#5D4037" transform="rotate(20, 38, 45)"/>
    <!-- 发带 -->
    <ellipse cx="35" cy="35" rx="8" ry="5" fill="#FFB800"/>
    <!-- 眼睛 -->
    <ellipse cx="-10" cy="68" rx="6" ry="8" fill="#FFF"/>
    <ellipse cx="10" cy="68" rx="6" ry="8" fill="#FFF"/>
    <circle cx="-10" cy="70" r="4" fill="#3B5FD9"/>
    <circle cx="10" cy="70" r="4" fill="#3B5FD9"/>
    <!-- 微笑 -->
    <path d="M-6 90 Q0 98 6 90" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="-20" cy="80" rx="8" ry="5" fill="#FFAB91" opacity="0.4"/>
    <ellipse cx="20" cy="80" rx="8" ry="5" fill="#FFAB91" opacity="0.4"/>
  </g>
  
  <!-- 孩子3 - 标本收集者 -->
  <g transform="translate(850, 490)">
    <!-- 身体 -->
    <ellipse cx="0" cy="145" rx="38" ry="52" fill="#8BC34A"/>
    <!-- 腿 -->
    <path d="M-12 190 Q-15 220 -10 250 L10 250 L12 190" fill="#5D4037"/>
    <!-- 鞋 -->
    <ellipse cx="0" cy="255" rx="20" ry="10" fill="#3E2723"/>
    <!-- 手臂 -->
    <path d="M-38 125 Q-55 110 -50 90" stroke="#FFCCBC" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M38 125 Q55 110 60 130" stroke="#FFCCBC" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- 标本盒 -->
    <g transform="translate(70, 120)">
      <rect x="-25" y="-20" width="50" height="40" rx="3" fill="#FFF" stroke="#8D6E63" stroke-width="2"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#DDD" stroke-width="1"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#DDD" stroke-width="1"/>
      <!-- 标本内容 -->
      <ellipse cx="-12" cy="-10" rx="8" ry="5" fill="#8BC34A"/>
      <circle cx="12" cy="-10" r="6" fill="#FFB800"/>
      <path d="M-12 8 Q-8 12 -12 16 Q-16 12 -12 8" fill="#7CB342"/>
    </g>
    <!-- 头部 -->
    <circle cx="0" cy="85" r="40" fill="#FFCCBC"/>
    <!-- 帽子 - 探险帽 -->
    <ellipse cx="0" cy="55" rx="48" ry="18" fill="#8D6E63"/>
    <ellipse cx="0" cy="45" rx="30" ry="22" fill="#A1887F"/>
    <!-- 头发 -->
    <path d="M-25 65 Q-28 50 -15 45 Q0 40 15 45 Q28 50 25 65" fill="#4E342E"/>
    <!-- 眼睛 -->
    <ellipse cx="-10" cy="82" rx="5" ry="7" fill="#FFF"/>
    <ellipse cx="10" cy="82" rx="5" ry="7" fill="#FFF"/>
    <circle cx="-10" cy="84" r="3.5" fill="#3B5FD9"/>
    <circle cx="10" cy="84" r="3.5" fill="#3B5FD9"/>
    <!-- 微笑 -->
    <path d="M-7 100 Q0 108 7 100" stroke="#8D6E63" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 放大镜 -->
    <g transform="translate(-60, 70)">
      <circle cx="0" cy="0" r="20" fill="#E3F2FD" opacity="0.6" stroke="#5D4037" stroke-width="4"/>
      <rect x="15" y="15" width="25" height="8" rx="4" fill="#8D6E63" transform="rotate(45, 15, 15)"/>
      <ellipse cx="-5" cy="-5" rx="8" ry="4" fill="#FFF" opacity="0.7"/>
    </g>
  </g>
  
  <!-- 前景植物和花朵 -->
  <g fill="#7CB342">
    <ellipse cx="80" cy="720" rx="60" ry="35"/>
    <ellipse cx="1120" cy="710" rx="55" ry="32"/>
  </g>
  
  <!-- 野花 -->
  <g transform="translate(100, 680)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#558B2F" stroke-width="3"/>
    <circle cx="0" cy="-5" r="10" fill="#FFB800"/>
    <circle cx="-8" cy="0" r="6" fill="#FF8F00"/>
    <circle cx="8" cy="0" r="6" fill="#FF8F00"/>
  </g>
  
  <g transform="translate(1100, 690)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#558B2F" stroke-width="3"/>
    <circle cx="0" cy="-5" r="8" fill="#3B5FD9"/>
    <circle cx="-6" cy="0" r="5" fill="#4A6FE3"/>
    <circle cx="6" cy="0" r="5" fill="#4A6FE3"/>
  </g>
  
  <!-- 蝴蝶 -->
  <g transform="translate(400, 350)">
    <path d="M0 0 Q-25 -20 -30 8 Q-25 25 0 12" fill="#3B5FD9" opacity="0.8"/>
    <path d="M0 0 Q25 -20 30 8 Q25 25 0 12" fill="#3B5FD9" opacity="0.8"/>
    <ellipse cx="0" cy="6" rx="3" ry="12" fill="#5D4037"/>
    <circle cx="-15" cy="5" r="5" fill="#FFB800" opacity="0.7"/>
    <circle cx="15" cy="5" r="5" fill="#FFB800" opacity="0.7"/>
  </g>
  
  <g transform="translate(950, 400)">
    <path d="M0 0 Q-20 -15 -25 5 Q-20 20 0 10" fill="#FFB800" opacity="0.7"/>
    <path d="M0 0 Q20 -15 25 5 Q20 20 0 10" fill="#FFB800" opacity="0.7"/>
    <ellipse cx="0" cy="5" rx="2" ry="10" fill="#5D4037"/>
  </g>
  
  <!-- 小鸟在天空 -->
  <g transform="translate(700, 150)" opacity="0.6">
    <path d="M0 0 Q-15 -8 -25 0 Q-15 3 0 0" fill="#5D4037"/>
    <path d="M0 0 Q15 -8 25 0 Q15 3 0 0" fill="#5D4037"/>
  </g>
  <g transform="translate(750, 180)" opacity="0.5">
    <path d="M0 0 Q-12 -6 -20 0 Q-12 2 0 0" fill="#5D4037"/>
    <path d="M0 0 Q12 -6 20 0 Q12 2 0 0" fill="#5D4037"/>
  </g>
  
  <!-- PBL 标志装饰 -->
  <g transform="translate(50, 50)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#3B5FD9" opacity="0.15"/>
    <text x="0" y="6" font-size="18" fill="#3B5FD9" text-anchor="middle" font-weight="bold" opacity="0.7">PBL</text>
  </g>
  
  <!-- 探索元素装饰 -->
  <g transform="translate(1150, 50)">
    <circle cx="0" cy="0" r="20" fill="#FFB800" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="-8" r="3" fill="#FFB800" opacity="0.6"/>
  </g>
  
  <!-- 边框 -->
  <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#3B5FD9" stroke-width="2" opacity="0.12" rx="8"/>
  
  <!-- 角落装饰 -->
  <circle cx="25" cy="25" r="8" fill="#3B5FD9" opacity="0.2"/>
  <circle cx="1175" cy="25" r="8" fill="#FFB800" opacity="0.2"/>
  <circle cx="25" cy="775" r="8" fill="#8BC34A" opacity="0.2"/>
  <circle cx="1175" cy="775" r="8" fill="#3B5FD9" opacity="0.2"/>
</svg>