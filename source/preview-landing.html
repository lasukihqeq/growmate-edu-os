<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROWMATE - Apple Design Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; }
    body { margin: 0; background: #fbfbfd; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 3px; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in-up { animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {
      Sparkles, BrainCircuit, Compass, Target, Activity, FileText, Search,
      Menu, Clock, ArrowRight, Lock, Zap, MoreHorizontal, BookOpen, PlayCircle,
      GraduationCap, Cpu, Network, Fingerprint, ChevronRight, Download,
      TrendingUp, Rocket, ShieldCheck, Info, Map, Layers, Award
    } = lucideReact;

    const { useState } = React;

    // ==========================================
    // 品牌专属 LOGO 组件 (Apple Squircle 美学)
    // ==========================================
    const GrowMateLogo = ({ className = "w-8 h-8" }) => (
      <div
        className={`relative flex items-center justify-center bg-gradient-to-b from-[#2c2c2e] to-[#151516] shadow-sm border border-white/10 ${className}`}
        style={{ borderRadius: '22.5%' }}
      >
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-[65%] h-[65%]">
          <path
            d="M50 15C50 34.33 65.67 50 85 50C65.67 50 50 65.67 50 85C50 65.67 34.33 50 15 50C34.33 50 50 34.33 50 15Z"
            fill="url(#gm-icon-grad)"
          />
          <circle cx="50" cy="50" r="7" fill="#151516" />
          <defs>
            <linearGradient id="gm-icon-grad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
              <stop stopColor="#e0e0e5" />
              <stop offset="1" stopColor="#ffffff" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    );

    // ==========================================
    // Landing Page
    // ==========================================
    function LandingPage({ onVerify }) {
      const [code, setCode] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      const handleVerify = (e) => {
        e.preventDefault();
        if (!code.trim()) return;
        setIsVerifying(true);
        setTimeout(() => {
          setIsVerifying(false);
          onVerify();
        }, 1200);
      };

      return (
        <div className="min-h-screen bg-[#fbfbfd] font-sans text-[#1d1d1f] overflow-hidden relative selection:bg-indigo-500/30 pb-32">
          <header className="absolute top-0 w-full z-20 px-6 py-4 flex justify-between items-center bg-[#fbfbfd]/80 backdrop-blur-md border-b border-[#1d1d1f]/[0.04]">
            <div className="flex items-center gap-2.5">
              <GrowMateLogo className="w-7 h-7" />
              <span className="text-[19px] font-bold tracking-tight text-[#1d1d1f]">GROWMATE</span>
            </div>
            <div className="hidden md:flex items-center gap-8 text-[13px] font-medium tracking-wide text-[#86868b]">
              <a href="#about" className="hover:text-[#1d1d1f] transition-colors">WILDER 测评</a>
              <a href="#persona" className="hover:text-[#1d1d1f] transition-colors">728 画像</a>
              <a href="#architecture" className="hover:text-[#1d1d1f] transition-colors">AI 架构</a>
            </div>
            <button className="md:hidden text-[#1d1d1f]">
              <Menu className="w-5 h-5" />
            </button>
          </header>

          <main className="relative z-10 pt-32 px-6 md:px-12 max-w-[1200px] mx-auto flex flex-col items-center text-center">
            <div className="max-w-3xl mx-auto space-y-6 animate-fade-in-up">
              <div className="inline-flex items-center justify-center gap-2 px-3 py-1 bg-gradient-to-r from-indigo-500/10 to-purple-500/10 rounded-full text-[11px] font-semibold tracking-widest text-indigo-600 uppercase">
                <Sparkles className="w-3.5 h-3.5" /> AI 潜能唤醒引擎
              </div>
              <h1 className="text-5xl md:text-7xl font-bold tracking-tighter text-[#1d1d1f] leading-[1.05]">
                别让天赋，止于沉睡。<br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
                  用 AI 与科学唤醒它。
                </span>
              </h1>
              <p className="text-xl md:text-2xl text-[#86868b] font-medium leading-relaxed max-w-2xl mx-auto mt-6 tracking-tight">
                每一个孩子都蕴藏着未被发掘的可能。GROWMATE 融合 WILDER 科学模型与前沿 AI 算法，打造「测评-画像-教育」全链路闭环，让天赋真正被看见。
              </p>
            </div>

            <div className="mt-16 w-full max-w-sm animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
              <form onSubmit={handleVerify} className="relative group">
                <div className="absolute -inset-2 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-[2rem] blur-xl opacity-0 group-focus-within:opacity-15 transition duration-500"></div>
                <div className="relative flex items-center p-2 bg-white/80 backdrop-blur-2xl rounded-full border border-black/[0.04] shadow-[0_8px_30px_rgb(0,0,0,0.04)] group-focus-within:bg-white transition-all duration-300">
                  <div className="pl-4 pr-2 text-[#86868b]">
                    <Lock className="w-5 h-5" />
                  </div>
                  <input
                    type="text"
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                    placeholder="输入邀请码进入专属空间"
                    className="flex-1 bg-transparent border-none outline-none px-2 text-[#1d1d1f] placeholder-[#86868b] font-medium text-[15px]"
                    disabled={isVerifying}
                  />
                  <button
                    type="submit"
                    disabled={isVerifying || !code.trim()}
                    className={`w-10 h-10 rounded-full flex items-center justify-center transition-all duration-300 ${
                      code.trim() && !isVerifying
                        ? 'bg-[#1d1d1f] text-white hover:scale-105 shadow-md'
                        : 'bg-[#f5f5f7] text-[#86868b] cursor-not-allowed'
                    }`}
                  >
                    {isVerifying ? (
                      <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    ) : (
                      <ArrowRight className="w-4 h-4" />
                    )}
                  </button>
                </div>
              </form>
              <p className="text-[12px] font-medium text-[#86868b] mt-4">任意字符均可体验内部系统</p>
            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // Dashboard
    // ==========================================
    function Dashboard() {
      const [activeTab, setActiveTab] = useState('reports');
      const [activePlan, setActivePlan] = useState('14');

      const wilderData = [
        { id: 'W', name: 'Willpower', label: '意志力', score: 85 },
        { id: 'I', name: 'Intellect', label: '探究力', score: 88 },
        { id: 'L', name: 'Leadership', label: '领导力', score: 78 },
        { id: 'D', name: 'Drive', label: '内驱力', score: 86 },
        { id: 'E', name: 'Empathy', label: '共情力', score: 75 },
        { id: 'R', name: 'Resilience', label: '抗挫力', score: 82 },
      ];

      const getRadarPoints = (data, maxRadius = 100, isBg = false) => {
        return data.map((d, i) => {
          const angle = (Math.PI / 3) * i - Math.PI / 2;
          const r = isBg ? maxRadius : maxRadius * (d.score / 100);
          const x = 150 + r * Math.cos(angle);
          const y = 150 + r * Math.sin(angle);
          return `${x},${y}`;
        }).join(' ');
      };

      const getRadarLabelPos = (i, maxRadius = 120) => {
        const angle = (Math.PI / 3) * i - Math.PI / 2;
        return {
          x: 150 + maxRadius * Math.cos(angle),
          y: 150 + maxRadius * Math.sin(angle),
        };
      };

      const eduJourney = {
        '14': [
          { id: 1, title: '认知力启蒙：乐高无图解构', type: 'PBL 核心课', date: '今日学习', duration: '25 min', isCourse: true },
          { id: 2, title: '情绪绘本交互：《小怪兽》', type: '共情力辅导', date: '明日', duration: '15 min', isCourse: false },
          { id: 3, title: '认知重构考核测验', type: '效果验证', date: '周三', duration: '10 min', isCourse: false },
        ]
      };

      return (
        <div className="min-h-screen bg-[#F5F5F7] font-sans text-[#1d1d1f] flex overflow-hidden animate-fade-in">

          {/* 侧边栏 */}
          <aside className="hidden lg:flex flex-col w-64 bg-[#F5F5F7] p-4 h-screen border-r border-[#1d1d1f]/[0.04] z-20 sticky top-0">
            <div className="flex items-center gap-2.5 px-4 py-6 mb-4">
              <GrowMateLogo className="w-8 h-8" />
              <span className="text-[18px] font-bold tracking-tight text-[#1d1d1f]">GROWMATE</span>
            </div>

            <nav className="flex-1 space-y-1">
              {[
                { id: 'dashboard', icon: Activity, label: '系统概览' },
                { id: 'evaluation', icon: Target, label: 'WILDER 测评' },
                { id: 'education', icon: BookOpen, label: 'PBL 教育库' },
                { id: 'reports', icon: FileText, label: '智能报告' },
              ].map((item) => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[15px] font-medium ${
                    activeTab === item.id
                      ? 'bg-white shadow-[0_2px_10px_rgb(0,0,0,0.04)] text-[#1d1d1f]'
                      : 'text-[#86868b] hover:bg-[#1d1d1f]/5'
                  }`}
                >
                  <item.icon className={`w-5 h-5 ${activeTab === item.id ? 'text-indigo-500' : 'text-[#86868b]'}`} strokeWidth={activeTab === item.id ? 2.5 : 2} />
                  {item.label}
                </button>
              ))}
            </nav>

            {/* 用户控制 */}
            <div className="mt-auto pb-4">
              <button className="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-[#1d1d1f]/5 transition-colors">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white text-sm font-bold">
                  张
                </div>
                <div className="text-left flex-1">
                  <p className="text-[14px] font-semibold text-[#1d1d1f]">张泽辉 (10岁)</p>
                  <p className="text-[12px] text-[#86868b]">四年级 · 深圳某实验小学</p>
                </div>
              </button>
            </div>
          </aside>

          {/* 主内容区 */}
          <main className="flex-1 h-screen overflow-y-auto relative scroll-smooth bg-[#fbfbfd]">
            <div className="px-6 py-8 md:px-10 md:py-12 max-w-6xl mx-auto space-y-8">

              {/* 系统概览 */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6 animate-fade-in-up">
                  <header className="mb-8">
                    <h1 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f]">系统概览</h1>
                    <p className="text-[15px] text-[#86868b] mt-2 font-medium">查看孩子的整体发展状态与关键数据。</p>
                  </header>

                  {/* 数据卡片 */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {[
                      { label: '综合发展指数', value: '82.3', unit: '/ 100', icon: TrendingUp, color: 'from-indigo-500 to-blue-500' },
                      { label: '已完成课程', value: '24', unit: '门', icon: BookOpen, color: 'from-purple-500 to-pink-500' },
                      { label: '连续学习天数', value: '17', unit: '天', icon: Zap, color: 'from-amber-500 to-orange-500' },
                    ].map((card, idx) => (
                      <div key={idx} className="bg-white rounded-2xl p-6 border border-black/[0.04] shadow-[0_2px_10px_rgb(0,0,0,0.02)]">
                        <div className="flex items-center justify-between mb-4">
                          <span className="text-[13px] font-medium text-[#86868b]">{card.label}</span>
                          <div className={`w-8 h-8 rounded-xl bg-gradient-to-br ${card.color} flex items-center justify-center`}>
                            <card.icon className="w-4 h-4 text-white" />
                          </div>
                        </div>
                        <div className="flex items-baseline gap-1">
                          <span className="text-3xl font-bold text-[#1d1d1f]">{card.value}</span>
                          <span className="text-[13px] text-[#86868b] font-medium">{card.unit}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* WILDER 雷达图 */}
                  <div className="bg-white rounded-2xl p-8 border border-black/[0.04] shadow-[0_2px_10px_rgb(0,0,0,0.02)]">
                    <h3 className="text-[17px] font-bold text-[#1d1d1f] mb-6">WILDER 六维能力模型</h3>
                    <div className="flex justify-center">
                      <svg viewBox="0 0 300 300" className="w-72 h-72">
                        {/* 背景网格 */}
                        {[100, 75, 50, 25].map(r => (
                          <polygon key={r} points={getRadarPoints(wilderData, r, true)} fill="none" stroke="#e5e5ea" strokeWidth="0.5" />
                        ))}
                        {/* 数据区域 */}
                        <polygon points={getRadarPoints(wilderData)} fill="url(#radarGrad)" stroke="#6366f1" strokeWidth="2" />
                        {/* 数据点 */}
                        {wilderData.map((d, i) => {
                          const angle = (Math.PI / 3) * i - Math.PI / 2;
                          const r = 100 * (d.score / 100);
                          const x = 150 + r * Math.cos(angle);
                          const y = 150 + r * Math.sin(angle);
                          return <circle key={i} cx={x} cy={y} r="4" fill="#6366f1" stroke="white" strokeWidth="2" />;
                        })}
                        {/* 标签 */}
                        {wilderData.map((d, i) => {
                          const pos = getRadarLabelPos(i);
                          return (
                            <text key={i} x={pos.x} y={pos.y} textAnchor="middle" dominantBaseline="middle" className="text-[11px] font-semibold" fill="#1d1d1f">
                              {d.id} {d.score}
                            </text>
                          );
                        })}
                        <defs>
                          <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#6366f1" stopOpacity="0.2" />
                            <stop offset="100%" stopColor="#a855f7" stopOpacity="0.1" />
                          </linearGradient>
                        </defs>
                      </svg>
                    </div>
                    <div className="grid grid-cols-3 md:grid-cols-6 gap-3 mt-6">
                      {wilderData.map(d => (
                        <div key={d.id} className="text-center">
                          <p className="text-[12px] text-[#86868b] font-medium">{d.label}</p>
                          <p className="text-[15px] font-bold text-[#1d1d1f]">{d.score}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* WILDER 测评 */}
              {activeTab === 'evaluation' && (
                <div className="space-y-6 animate-fade-in-up">
                  <header className="mb-8">
                    <h1 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f]">WILDER 测评</h1>
                    <p className="text-[15px] text-[#86868b] mt-2 font-medium">基于 WILDER 六维模型的科学化多模态测评。</p>
                  </header>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {wilderData.map(d => (
                      <div key={d.id} className="bg-white rounded-2xl p-6 border border-black/[0.04] shadow-[0_2px_10px_rgb(0,0,0,0.02)] hover:shadow-md transition-shadow">
                        <div className="flex items-center justify-between mb-4">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500/10 to-purple-500/10 flex items-center justify-center">
                              <span className="text-[16px] font-bold text-indigo-600">{d.id}</span>
                            </div>
                            <div>
                              <p className="text-[15px] font-semibold text-[#1d1d1f]">{d.name}</p>
                              <p className="text-[12px] text-[#86868b]">{d.label}</p>
                            </div>
                          </div>
                          <span className="text-2xl font-bold text-[#1d1d1f]">{d.score}</span>
                        </div>
                        <div className="w-full h-2 bg-[#f5f5f7] rounded-full overflow-hidden">
                          <div
                            className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-700"
                            style={{ width: `${d.score}%` }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PBL 教育库 */}
              {activeTab === 'education' && (
                <div className="space-y-6 animate-fade-in-up">
                  <header className="mb-8">
                    <h1 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f]">PBL 教育库</h1>
                    <p className="text-[15px] text-[#86868b] mt-2 font-medium">个性化推荐的项目制学习课程。</p>
                  </header>

                  <div className="bg-white rounded-2xl border border-black/[0.04] shadow-[0_2px_10px_rgb(0,0,0,0.02)] overflow-hidden">
                    <div className="p-6 border-b border-black/[0.04]">
                      <div className="flex items-center gap-2">
                        <Rocket className="w-5 h-5 text-indigo-500" />
                        <h3 className="text-[17px] font-bold text-[#1d1d1f]">本周学习计划</h3>
                      </div>
                    </div>
                    <div className="divide-y divide-black/[0.04]">
                      {eduJourney['14'].map((item) => (
                        <div key={item.id} className="flex items-center justify-between p-5 hover:bg-[#f5f5f7]/50 transition-colors cursor-pointer">
                          <div className="flex items-center gap-4">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                              item.isCourse
                                ? 'bg-gradient-to-br from-indigo-500 to-purple-500 text-white'
                                : 'bg-[#f5f5f7] text-[#86868b]'
                            }`}>
                              {item.isCourse ? <PlayCircle className="w-5 h-5" /> : <Clock className="w-5 h-5" />}
                            </div>
                            <div>
                              <p className="text-[15px] font-semibold text-[#1d1d1f]">{item.title}</p>
                              <div className="flex items-center gap-2 mt-0.5">
                                <span className="text-[12px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600 font-medium">{item.type}</span>
                                <span className="text-[12px] text-[#86868b]">{item.duration}</span>
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="text-[13px] text-[#86868b] font-medium">{item.date}</span>
                            <ChevronRight className="w-4 h-4 text-[#d1d1d6]" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 智能报告 */}
              {activeTab === 'reports' && (
                <div className="space-y-6 animate-fade-in-up">

                  <header className="flex items-center justify-between mb-8">
                    <div>
                      <h1 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f]">智能报告</h1>
                      <p className="text-[15px] text-[#86868b] mt-2 font-medium">深入解析孩子的专属潜能解码蓝图。</p>
                    </div>
                    <button className="hidden md:flex items-center gap-2 px-5 py-2.5 bg-white border border-black/[0.04] shadow-[0_2px_10px_rgb(0,0,0,0.02)] rounded-full text-[14px] font-semibold text-[#1d1d1f] hover:bg-[#f5f5f7] transition-all hover:shadow-md">
                      <Download className="w-4 h-4" /> 导出完整 PDF
                    </button>
                  </header>

                  {/* 沉浸式数字报告容器 */}
                  <div className="bg-white rounded-[2.5rem] border border-black/[0.04] shadow-[0_8px_40px_rgb(0,0,0,0.03)] relative overflow-hidden">

                    {/* 封面信息区 */}
                    <div className="relative pt-16 pb-14 px-8 md:px-14 border-b border-black/[0.04] overflow-hidden">
                      {/* 背景装饰 */}
                      <div className="absolute inset-0 bg-gradient-to-br from-indigo-500/5 via-transparent to-purple-500/5" />
                      <div className="absolute top-0 right-0 w-96 h-96 bg-gradient-to-bl from-indigo-500/10 to-transparent rounded-full blur-3xl -translate-y-1/2 translate-x-1/3" />

                      <div className="relative z-10">
                        <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 text-indigo-600 text-[11px] font-bold tracking-wider uppercase mb-6">
                          <Fingerprint className="w-3.5 h-3.5" /> 潜能解码蓝图
                        </div>
                        <h2 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f] leading-tight">
                          张泽辉的<br />
                          <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500">
                            728 专属画像报告
                          </span>
                        </h2>
                        <p className="text-[15px] text-[#86868b] mt-4 max-w-lg leading-relaxed">
                          基于 WILDER 六维能力评估模型，结合 AI 多模态行为分析，为您的孩子生成全方位潜能解码蓝图。

                            { label: '画像编码', value: 'W85-I88-L78-D86-E75-R82' },

                            { label: '综合指数', value: '82.3 / 100' },
                          ].map((tag, idx) => (
                            <div key={idx} className="px-4 py-2 bg-white/80 backdrop-blur-sm rounded-xl border border-black/[0.04]">
                              <p className="text-[11px] text-[#86868b] font-medium">{tag.label}</p>
                              <p className="text-[14px] font-bold text-[#1d1d1f] mt-0.5">{tag.value}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* 核心发现摘要 */}
                    <div className="px-8 md:px-14 py-10 border-b border-black/[0.04]">
                      <div className="flex items-center gap-2 mb-6">
                        <Sparkles className="w-5 h-5 text-indigo-500" />
                        <h3 className="text-[20px] font-bold text-[#1d1d1f]">核心发现</h3>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {[
                          { icon: BrainCircuit, title: '探究力突出', desc: '在结构化思维与知识整合方面表现优异，具备科研潜质。', score: 88, color: 'indigo' },
                          { icon: Rocket, title: '内驱力强劲', desc: '自主学习意愿显著高于同龄均值，目标感清晰。', score: 86, color: 'purple' },
                          { icon: ShieldCheck, title: '抗挫力稳健', desc: '面对挑战时情绪调节能力良好，恢复速度快。', score: 82, color: 'blue' },
                        ].map((item, idx) => (
                          <div key={idx} className="p-5 rounded-2xl bg-[#f5f5f7]/50 border border-black/[0.02] hover:bg-white hover:shadow-sm transition-all">
                            <div className={`w-10 h-10 rounded-xl bg-${item.color}-500/10 flex items-center justify-center mb-3`}>
                              <item.icon className={`w-5 h-5 text-${item.color}-500`} />
                            </div>
                            <div className="flex items-center justify-between mb-2">
                              <h4 className="text-[15px] font-bold text-[#1d1d1f]">{item.title}</h4>
                              <span className="text-[13px] font-bold text-indigo-500">{item.score}</span>

                        <Layers className="w-5 h-5 text-indigo-500" />
                        <h3 className="text-[20px] font-bold text-[#1d1d1f]">六维详细分析</h3>
                      </div>
                      <div className="space-y-4">
                        {wilderData.map((d, idx) => (
                          <div key={d.id} className="flex items-center gap-5 p-4 rounded-2xl hover:bg-[#f5f5f7]/50 transition-colors">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500/10 to-purple-500/10 flex items-center justify-center flex-shrink-0">
                              <span className="text-[18px] font-bold text-indigo-600">{d.id}</span>
                            </div>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center justify-between mb-2">
                                <div>
                                  <span className="text-[15px] font-semibold text-[#1d1d1f]">{d.name}</span>
                                  <span className="text-[13px] text-[#86868b] ml-2">{d.label}</span>
                                </div>
                                <span className="text-[17px] font-bold text-[#1d1d1f]">{d.score}<span className="text-[12px] text-[#86868b] font-normal">/100</span></span>
                              </div>
                              <div className="w-full h-2.5 bg-[#f5f5f7] rounded-full overflow-hidden">
                                <div
                                  className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-1000"
                                  style={{ width: `${d.score}%` }}
                                />
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 教育建议 */}
                    <div className="px-8 md:px-14 py-10 border-b border-black/[0.04]">
                      <div className="flex items-center gap-2 mb-6">
                        <GraduationCap className="w-5 h-5 text-indigo-500" />

                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {[
                          { icon: Compass, title: '优先发展方向', items: ['结构化思维深度训练', '科学探究项目参与', '跨学科整合练习'] },
                          { icon: Award, title: '潜力激发策略', items: ['给予更多自主决策机会', '引导同伴协作与领导角色', '创设适度挑战性任务情境'] },
                        ].map((section, idx) => (
                          <div key={idx} className="p-5 rounded-2xl bg-[#f5f5f7]/50 border border-black/[0.02]">
                            <div className="flex items-center gap-2 mb-4">
                              <section.icon className="w-5 h-5 text-indigo-500" />
                              <h4 className="text-[15px] font-bold text-[#1d1d1f]">{section.title}</h4>
                            </div>
                            <ul className="space-y-2.5">
                              {section.items.map((item, i) => (
                                <li key={i} className="flex items-start gap-2.5 text-[14px] text-[#1d1d1f]/80">
                                  <ChevronRight className="w-4 h-4 text-indigo-500 mt-0.5 flex-shrink-0" />
                                  <span>{item}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* AI 架构说明 */}
                    <div className="px-8 md:px-14 py-10">
                      <div className="flex items-center gap-2 mb-6">
                        <Cpu className="w-5 h-5 text-indigo-500" />
                        <h3 className="text-[20px] font-bold text-[#1d1d1f]">AI 技术架构</h3>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {[
                          { icon: Network, title: '多模态评估引擎', desc: '融合结构化量表 + AI 对话 + 行为观测三通道数据，交叉验证评估结果。' },
                          { icon: BrainCircuit, title: '728 画像算法', desc: '基于 WILDER 六维 × 分值组合生成 728 种独特画像编码，精准刻画个体特征。' },
                          { icon: Fingerprint, title: '动态报告生成', desc: '每份报告由 AI 实时生成，根据画像编码匹配专属教育建议与发展路径。' },
                        ].map((item, idx) => (
                          <div key={idx} className="p-5 rounded-2xl bg-gradient-to-br from-[#1d1d1f] to-[#2c2c2e] text-white">
                            <item.icon className="w-6 h-6 text-indigo-400 mb-3" />
                            <h4 className="text-[15px] font-bold mb-2">{item.title}</h4>
                            <p className="text-[13px] text-white/60 leading-relaxed">{item.desc}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // App 主组件
    // ==========================================
    function App() {
      const [page, setPage] = useState('landing');

      return page === 'landing'
        ? <LandingPage onVerify={() => setPage('dashboard')} />
        : <Dashboard />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
